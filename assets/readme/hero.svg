<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">LabelAll — open, view and annotate common image datasets</title>
  <desc id="hero-desc">LabelAll wordmark beside a stylised annotation canvas showing bounding boxes, class label chips and a keypoint over two sample shapes.</desc>

  <!-- Card surface: MD3 baseline light scheme (seed #6750A4). -->
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="28" fill="#FEF7FF" stroke="#E7E0EC" stroke-width="1.5"/>

  <!-- Wordmark, promise and metadata -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', Helvetica, Arial, sans-serif">
    <text x="64" y="94" font-size="16" font-weight="600" letter-spacing="2.6" fill="#6750A4"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">IMAGE DATASET ANNOTATION</text>

    <text x="62" y="180" font-size="80" font-weight="700" letter-spacing="-2" fill="#1D1B20">LabelAll</text>

    <text x="64" y="234" font-size="26" fill="#49454F">Open, view and annotate COCO, YOLO, VOC</text>
    <text x="64" y="270" font-size="26" fill="#49454F">and ImageFolder datasets — straight from a folder.</text>

    <text x="64" y="324" font-size="16" fill="#79747E"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Apache-2.0 · macOS · Windows · Linux · Desktop + Web</text>
  </g>

  <!-- Project material: an annotation canvas, the thing LabelAll actually works with. -->
  <g id="annotation-canvas">
    <rect x="700" y="52" width="452" height="276" rx="22" fill="#F3EDF7" stroke="#E7E0EC" stroke-width="1.5"/>
    <rect x="722" y="74" width="408" height="232" rx="14" fill="#EDEEF3"/>

    <!-- Sample shape one: a box annotation with handles and a class chip. -->
    <rect x="748" y="128" width="118" height="88" rx="8" fill="#C3C6D6"/>
    <rect x="740" y="120" width="134" height="104" rx="3" fill="none" stroke="#0091FF" stroke-width="3"/>
    <g fill="#FFFFFF" stroke="#0091FF" stroke-width="3">
      <rect x="732" y="112" width="16" height="16" rx="2"/>
      <rect x="866" y="112" width="16" height="16" rx="2"/>
      <rect x="732" y="216" width="16" height="16" rx="2"/>
      <rect x="866" y="216" width="16" height="16" rx="2"/>
      <rect x="799" y="112" width="16" height="16" rx="2"/>
      <rect x="799" y="216" width="16" height="16" rx="2"/>
      <rect x="732" y="164" width="16" height="16" rx="2"/>
      <rect x="866" y="164" width="16" height="16" rx="2"/>
    </g>
    <rect x="740" y="88" width="118" height="26" rx="13" fill="#0091FF"/>
    <text x="753" y="107" font-size="16" font-weight="600" fill="#FFFFFF"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rectangle</text>

    <!-- Keypoints: the pose annotation type. -->
    <g stroke="#6750A4" stroke-width="3" stroke-linecap="round">
      <path d="M801 168 h12 M807 162 v12"/>
    </g>
    <circle cx="807" cy="168" r="4.5" fill="#6750A4"/>

    <!-- Sample shape two: a second class and box, coloured from the app palette. -->
    <circle cx="1046" cy="244" r="52" fill="#C9CBD8"/>
    <rect x="988" y="186" width="116" height="116" rx="3" fill="none" stroke="#E5484D" stroke-width="3"/>
    <rect x="988" y="154" width="90" height="26" rx="13" fill="#E5484D"/>
    <text x="1001" y="173" font-size="16" font-weight="600" fill="#FFFFFF"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">circle</text>
  </g>
</svg>
