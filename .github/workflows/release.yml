name: Release

# Push a version tag (e.g. v0.1.0) to build installers for all platforms and
# draft a GitHub release. No signing keys are required: the macOS build is
# ad-hoc signed (bundle.macOS.signingIdentity = "-"). See RELEASING.md for how to
# cut a release, and for the optional Apple Developer signing/notarization.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft release once, before the build matrix fans out. Every matrix
  # job then uploads its bundles to this single release. Without this, several
  # jobs can look for the release at the same time, find nothing, and each create
  # their own release with the same tag — which splits the assets (and leaves
  # each latest.json with only part of the platforms) across duplicate releases.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Create the draft release (version tags only)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/tags/v* ]]; then
            echo "Ref $REF is not a version tag; skipping release creation."
            echo "release_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" \
              --verify-tag \
              --draft \
              --title "LabelAll $TAG" \
              --notes-file - <<'RELEASE_NOTES'
          See CHANGELOG.md for what changed in this release.

          ### macOS first launch

          The macOS build is ad-hoc signed (not notarized), so macOS quarantines apps
          downloaded from the internet. If you see “App is damaged” or “cannot verify
          the developer”, run this in Terminal, then open the app normally:

          ```bash
          xattr -cr /Applications/LabelAll.app
          ```
          RELEASE_NOTES
          fi

          echo "release_id=$(gh release view "$TAG" --json id -q .id)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            args: ''
          - label: Windows
            platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for auto-update: signs the bundles and writes latest.json.
          # The build fails without it, so add the secret before tagging (RELEASING.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional Apple code-signing/notarization; add after following RELEASING.md.
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: LabelAll ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for what changed in this release.

            ### macOS first launch

            The macOS build is ad-hoc signed (not notarized), so macOS quarantines apps
            downloaded from the internet. If you see “App is damaged” or “cannot verify
            the developer”, run this in Terminal, then open the app normally:

            ```bash
            xattr -cr /Applications/LabelAll.app
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # A second Windows installer that bundles the full WebView2 runtime, for
  # intranet/air-gapped machines that cannot download it during setup. It is
  # attached to the draft release created above as an extra asset and is not
  # part of latest.json, so it never participates in auto-update.
  windows-offline:
    name: Build (Windows · offline WebView2)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the offline installer (bundled WebView2)
        run: pnpm tauri build --config src-tauri/tauri.windows-offline.conf.json

      - name: Suffix the offline installers
        shell: bash
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Windows installers were produced" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            mv "$f" "${f%.*}-offline.${f##*.}"
          done

      - name: Attach the offline installers to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/nsis/*-offline.exe \
            src-tauri/target/release/bundle/msi/*-offline.msi \
            --clobber
