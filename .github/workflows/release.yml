name: Release

# Push a version tag (e.g. v0.1.0) to build installers for all platforms and
# draft a GitHub release. See RELEASING.md for how to cut a release and how to
# add optional code-signing secrets.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            args: ''
          - label: Windows
            platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add the code-signing secrets here after following RELEASING.md.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LabelAll ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed in this release.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
