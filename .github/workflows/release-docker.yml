name: Release Docker

# Publishes the web build to Docker Hub on a version tag, for both amd64 and
# arm64, then merges the two into one multi-arch manifest. Needs the repository
# secret DOCKERHUB_TOKEN — see DEPLOY.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ailm32442/labelall
  DOCKERHUB_USERNAME: ailm32442

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # `secrets` cannot be read in an `if:`, so expose what we need as an output
      # and skip quietly when the token is missing.
      - name: Check for Docker Hub credentials
        id: creds
        run: |
          if [ -n "${TOKEN}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_TOKEN is not set; skipping the Docker Hub push (see DEPLOY.md)."
          fi
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.creds.outputs.have == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.creds.outputs.have == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: steps.creds.outputs.have == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: steps.creds.outputs.have == 'true'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: digests
          merge-multiple: true
          pattern: digest-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest

      - name: Create and push manifest
        run: |
          TAGS=$(echo "$META_TAGS" | tr '\n' ' ' | xargs -n1 printf -- '-t %s ')
          DIGESTS=""
          for f in $(find digests -type f); do
            DIGESTS="$DIGESTS $IMAGE@sha256:$(basename "$f")"
          done
          echo "tags: $TAGS"
          echo "digests: $DIGESTS"
          docker buildx imagetools create $TAGS $DIGESTS
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ${{ env.IMAGE }}
